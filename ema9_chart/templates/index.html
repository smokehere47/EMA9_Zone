<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMA9 Zone — Trading Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div id="app">
  <header class="top-bar">
    <div class="brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name">EMA9<span class="brand-accent">Zone</span></span>
    </div>
    <nav class="symbol-bar">
      <div class="symbol-search">
        <input type="text" id="symbolInput" placeholder="Search symbol…" autocomplete="off"/>
        <span class="search-icon">⌕</span>
      </div>
      <div class="symbol-tabs" id="symbolTabs"></div>
    </nav>
    <div class="top-controls">
      <div class="tf-group" id="tfGroup"></div>
      <button class="icon-btn" id="alertsBtn" title="Alerts">🔔<span class="badge" id="alertBadge"></span></button>
      <div class="connection-dot" id="connDot" title="WebSocket"></div>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar-left">
      <div class="sidebar-section">
        <div class="section-label">WATCHLIST</div>
        <div id="watchlist" class="watchlist"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-label">SIGNALS</div>
        <div id="signalLog" class="signal-log"></div>
      </div>
    </aside>

    <main class="chart-area">
      <div class="chart-header">
        <div class="chart-symbol-info">
          <span class="cs-symbol" id="csSymbol">—</span>
          <span class="cs-price"  id="csPrice">—</span>
          <span class="cs-change" id="csChange"></span>
          <span id="trendBadge" class="trend-badge trend-sideways">➡️ Sideways</span>
        </div>
        <div class="chart-ohlc" id="chartOHLC"></div>
        <div class="chart-indicators" id="chartIndicators">
          <span class="ind-tag active" data-ind="EMA 9">EMA 9</span>
          <span class="ind-tag active" data-ind="EMA 21">EMA 21</span>
          <span class="ind-tag active" data-ind="VWAP">VWAP</span>
        </div>
      </div>
      <div class="chart-panels">
        <div id="mainChart" class="main-chart"></div>
        <div class="chart-resize-handle" id="resizeHandle"></div>
        <div id="subChart" class="sub-chart"></div>
      </div>
      <div class="chart-footer">
        <div class="footer-stats" id="footerStats"></div>
      </div>
    </main>

    <aside class="sidebar-right">
      <div class="tabs-row">
        <button class="tab-btn active" data-tab="analysis">Analysis</button>
        <button class="tab-btn"        data-tab="alerts">Alerts</button>
        <button class="tab-btn"        data-tab="positions">Positions</button>
      </div>
      <div class="tab-panel active" id="tab-analysis">
        <div class="analysis-card">
          <div class="card-label">TREND BIAS</div>
          <div class="trend-meter">
            <div class="trend-bar"><div class="trend-fill" id="trendFill" style="width:50%"></div></div>
            <div class="trend-labels"><span>BEAR</span><span>NEUTRAL</span><span>BULL</span></div>
          </div>
        </div>
        <div class="analysis-card">
          <div class="card-label">EMA STRUCTURE</div>
          <div id="emaStructure" class="ema-structure"></div>
        </div>
        <div class="analysis-card">
          <div class="card-label">ZONE LEVELS</div>
          <div id="zoneLevels" class="zone-levels"></div>
        </div>
        <div class="analysis-card">
          <div class="card-label">MARKET STATS</div>
          <div id="marketStats" class="market-stats-grid"></div>
        </div>
      </div>
      <div class="tab-panel" id="tab-alerts">
        <div class="alert-form">
          <select id="alertSymbol"    class="form-select"></select>
          <select id="alertCondition" class="form-select">
            <option value="cross_above">Crosses Above</option>
            <option value="cross_below">Crosses Below</option>
            <option value="ema_touch">EMA Touch</option>
            <option value="zone_enter">Zone Entry</option>
          </select>
          <input type="number" id="alertPrice" class="form-input" placeholder="Price level…"/>
          <button class="btn-primary" id="addAlertBtn">+ Add Alert</button>
        </div>
        <div id="alertsList" class="alerts-list"></div>
      </div>
      <div class="tab-panel" id="tab-positions">
        <div id="positionsList" class="positions-list"></div>
        <div class="pnl-summary"  id="pnlSummary"></div>
      </div>
    </aside>
  </div>
  <div class="toast-container" id="toastContainer"></div>
</div>

<script src="{{ url_for('static', filename='js/wsManager.js') }}"></script>
<script src="{{ url_for('static', filename='js/dataStore.js') }}"></script>
<script src="{{ url_for('static', filename='js/chartEngine.js') }}"></script>
<script src="{{ url_for('static', filename='js/signalRenderer.js') }}"></script>
<script src="{{ url_for('static', filename='js/alertSystem.js') }}"></script>
<script src="{{ url_for('static', filename='js/analysisPanel.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
